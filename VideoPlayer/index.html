<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body onload="init()">
    <div id="file-select-view">
      <button id="loadVideo">Load Video</button>
    </div>
    <div id="video-view">
      <video id="video" playsinline></video>
      <div id="video-controls">
        <div id="controls">
          <div id="controls-button-area">
            <button id="playPause">Play</button>
            <div id="currentTime">--:--</div>
          </div>
          <div id="controls-input-area">
            <div>
              <label for="startTime">A:</label>
              <input type="number" id="startTime" value="0" step="0.1" min="0">
              <button id="setStartTime" class="setButton">Set</button>
            </div>
            <div>
              <label for="endTime">B:</label>
              <input type="number" id="endTime" value="0" step="0.1" min="0">
              <button id="setEndTime" class="setButton">Set</button>
            </div>
            <div>
              <label for="speed">Speed:</label>
              <select id="speed">
                <option value="0.5">0.5x</option>
                <option value="0.6">0.6x</option>
                <option value="0.7">0.7x</option>
                <option value="0.8">0.8x</option>
                <option value="0.9">0.9x</option>
                <option value="1" selected>1x</option>
                <option value="1.1">1.1x</option>
                <option value="1.2">1.2x</option>
                <option value="1.3">1.3x</option>
                <option value="1.4">1.4x</option>
                <option value="1.5">1.5x</option>
              </select>
            </div>
          </div>
        </div>
        <div id="time-range-slider"></div>
      </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
